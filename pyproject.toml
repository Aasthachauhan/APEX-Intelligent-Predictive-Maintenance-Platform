[project]
name = "apex-predictive-maintenance"
version = "0.2.0"
description = "Intelligent Predictive Maintenance & ML Operations Platform"
authors = [
    { name = "Aastha Chauhan", email = "chauhanaastha438@gmail.com" }
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "I"]
ignore = ["S101", "E501", "B008"]  # B008: FastAPI's Depends()/File() defaults are the documented idiom

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S", "E402"]
"scripts/*" = ["S", "E402"]  # harness: spawns subprocesses, imports after sys.path setup

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
