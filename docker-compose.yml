services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: apex, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in .env}", POSTGRES_DB: apex}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U apex"], interval: 5s, retries: 10}
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://apex:${POSTGRES_PASSWORD}@db:5432/apex
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]
    volumes: ["./artifacts:/app/artifacts"]
volumes: {pgdata: {}}
